[project]
name = "homelab-ai"
version = "0.1.0"
description = "Homelab automation: Paperless-ngx classification with Claude, Open WebUI tools, read-only server API"
requires-python = ">=3.10"
readme = "README.md"
license = { text = "MIT" }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["paperless-organize", "server-api", "openwebui-tools"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# Docstrings are read by the LLM as tool descriptions: keep them on one line.
"openwebui-tools/*.py" = ["E501"]
